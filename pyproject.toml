[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sightline-ui"
version = "0.2.0.dev1"
description = "A pixel-only interface automation engine by Yousif Lubbad"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Yousif Lubbad"}]
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<14"]

[project.optional-dependencies]
desktop = ["mss>=10.2,<11", "PyAutoGUI>=0.9.54,<0.10"]
ocr = ["easyocr==1.7.2"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.15,<3", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/YOUSIF-LUBBAD/Sightline"
Repository = "https://github.com/YOUSIF-LUBBAD/Sightline"
Issues = "https://github.com/YOUSIF-LUBBAD/Sightline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sightline"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "docs", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CONTRIBUTING.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "ocr: runs actual EasyOCR model inference (opt in)",
  "live: captures and clicks an isolated desktop (opt in)",
]

[tool.coverage.run]
source = ["sightline"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sightline"]

[[tool.mypy.overrides]]
module = ["easyocr.*", "mss.*", "pyautogui.*"]
ignore_missing_imports = true
