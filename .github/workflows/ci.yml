name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Check formatting, lint, and types
        run: |
          ruff format --check .
          ruff check .
          mypy
      - name: Run offline tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=artifacts/unit.xml
      - name: Build the source archive and wheel
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-python-${{ matrix.python }}
          path: |
            coverage.xml
            artifacts/unit.xml
            dist/
          retention-days: 14

  native-demo:
    name: Real OCR and native clicks (${{ matrix.screen }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        screen: [1280x800x24, 1920x1080x24]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SIGHTLINE_ARTIFACT_DIR: artifacts/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the isolated display and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk fonts-dejavu-core
      - name: Install CPU inference and Sightline
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu torchvision==0.29.2+cpu
          python -m pip install -e '.[dev,desktop,ocr]'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .models
          key: easyocr-1.7.2-en-craft-g2-v1
      - name: Test only the project-owned demo inside Xvfb
        run: >-
          xvfb-run -a -s '-screen 0 ${{ matrix.screen }} -nolisten tcp'
          python -m pytest --run-ocr --run-live --download-models
          -m 'ocr or live' --junitxml=artifacts/native.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ matrix.screen }}
          path: artifacts/
          retention-days: 14
